<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Krish P. — earphones</title>
  <style>
    :root {
      --bg0: #ffffff;
      --bg1: #f1f1f3;
      --bg2: #dfdfe3;
      --ink: #1d1d1f;
      --muted: #8a8a8f;
      --chip: rgba(255, 255, 255, 0.78);
      --line: rgba(0, 0, 0, 0.09);
      --shade: 0 1px 2px rgba(0, 0, 0, 0.06), 0 4px 14px rgba(0, 0, 0, 0.06);
      color-scheme: light;
    }
    [data-theme='dark'] {
      --bg0: #2b2b2f;
      --bg1: #161618;
      --bg2: #070708;
      --ink: #f2f2f4;
      --muted: #8d8d93;
      --chip: rgba(44, 44, 48, 0.72);
      --line: rgba(255, 255, 255, 0.1);
      --shade: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.3);
      color-scheme: dark;
    }
    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg1);
      overflow: hidden;
      font: 500 12px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    #stage {
      position: fixed;
      inset: 0;
      touch-action: none; /* drags and pinches belong to the 3D view */
      /* a studio sweep: white plastic needs a little grey around it to read */
      background: radial-gradient(120% 95% at 50% 32%, var(--bg0) 0%, var(--bg1) 58%, var(--bg2) 100%);
      transition: background-color 0.3s;
    }
    #stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      letter-spacing: 0.12em;
      color: var(--muted);
      transition: opacity 0.4s;
      pointer-events: none;
    }
    .loading.done {
      opacity: 0;
    }
    .tools {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.5s 0.2s;
    }
    .ready .tools,
    .ready .hint {
      opacity: 1;
    }
    .tools button {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--chip);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      box-shadow: var(--shade);
      color: var(--ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .tools button:hover {
      transform: scale(1.06);
    }
    .tools button:active {
      transform: scale(0.94);
    }
    .tools button:focus-visible {
      outline: 2px solid #0a84ff;
      outline-offset: 2px;
    }
    .tools svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tools .sep {
      height: 4px;
    }
    [data-theme='light'] .moon,
    [data-theme='dark'] .sun {
      display: none;
    }
    .hint {
      position: fixed;
      left: 50%;
      top: max(18px, env(safe-area-inset-top));
      margin: 0;
      transform: translateX(-50%);
      color: var(--muted);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s;
    }
    .ready .hint.gone {
      opacity: 0;
    }
    @media (max-width: 520px) {
      .hint {
        white-space: normal;
        width: 78%;
        text-align: center;
      }
    }
    /* narrow screens: the buttons in a row along the bottom, clear of the earphones */
    @media (max-width: 640px) and (orientation: portrait) {
      .tools {
        right: auto;
        left: 50%;
        transform: translateX(-50%);
        flex-direction: row;
      }
      .tools .sep {
        width: 4px;
        height: auto;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div class="loading" id="loading">LOADING</div>
  <p class="hint" id="hint">Drag to turn · drag an earbud or the cable · scroll or pinch to zoom</p>
  <div class="tools" role="toolbar" aria-label="View">
    <button type="button" data-action="zoom-in" aria-label="Zoom in" title="Zoom in">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
    </button>
    <button type="button" data-action="zoom-out" aria-label="Zoom out" title="Zoom out">
      <svg viewBox="0 0 24 24"><path d="M5 12h14" /></svg>
    </button>
    <button type="button" data-action="reset" aria-label="Reset view" title="Reset view">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7" /><path d="M4 4v4.5h4.5" /></svg>
    </button>
    <div class="sep"></div>
    <button type="button" data-action="theme" aria-label="Light or dark background" title="Light or dark background">
      <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" /></svg>
    </button>
  </div>
  <script type="module" src="./earpods/main.js"></script>
</body>
</html>
