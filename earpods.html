<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Krish P. — earphones</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #f2f2f4;
      overflow: hidden;
    }
    #stage {
      position: fixed;
      inset: 0;
      touch-action: none; /* drags and pinches belong to the 3D view */
      /* a soft studio backdrop: white plastic needs a little grey around it to read */
      background: radial-gradient(120% 90% at 50% 30%, #fbfbfc 0%, #f1f1f3 55%, #e6e6e9 100%);
    }
    #stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      font: 500 13px/1 system-ui, -apple-system, 'Segoe UI', sans-serif;
      letter-spacing: 0.08em;
      color: #9a9a9a;
      transition: opacity 0.4s;
      pointer-events: none;
    }
    .loading.done {
      opacity: 0;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div class="loading" id="loading">LOADING</div>
  <script type="module" src="./earpods/main.js"></script>
</body>
</html>
