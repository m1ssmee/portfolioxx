  <script type="module">
    const el = document.getElementById('still')
    const url = (id) => URL.createObjectURL(new Blob([document.getElementById(id).textContent], { type: 'text/javascript' }))
    let started = false
    const start = () => {
      if (started) return
      started = true
      import(url('cg-scene')).then(({ createScene }) => {
        window.createScene = createScene
        window.stillLife = createScene(el, { workerUrl: url('cg-worker') })
      })
    }
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((es) => {
        if (es.some((e) => e.isIntersecting)) {
          io.disconnect()
          start()
        }
      }, { rootMargin: '200px' })
      io.observe(el)
    } else start()
  </script>
