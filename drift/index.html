<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Drift Wired</title>
  <meta name="description" content="Drift Wired in-ear headphones: an interactive 3D viewer." />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #d6d7d9;
    }
    /* the viewer fills this box; the poster shows at once, under it, until the first frame */
    #drift {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    #drift .dw-poster {
      position: absolute;
      left: 50%;
      top: 0;
      height: 100%;
      width: auto;
      min-width: 100%;
      max-width: none;
      object-fit: cover;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <div id="drift">
    <picture>
      <source media="(max-aspect-ratio: 5/4)" srcset="poster-tall.webp" type="image/webp" />
      <img class="dw-poster" src="poster-wide.webp" alt="Drift Wired in-ear headphones in graphite, lying on a light grey studio floor" fetchpriority="high" decoding="async" onload="window.__dwPoster = performance.now()" />
    </picture>
  </div>
  <script type="module">
    // nothing heavy loads until the viewer is near the screen
    const el = document.getElementById('drift')
    let started = false
    const start = () => {
      if (started) return
      started = true
      import('./drift-viewer.js').then(({ createViewer }) => {
        window.driftViewer = createViewer(el)
      })
    }
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((es) => {
        if (es.some((e) => e.isIntersecting)) {
          io.disconnect()
          start()
        }
      }, { rootMargin: '200px' })
      io.observe(el)
    } else start()
  </script>
</body>
</html>
