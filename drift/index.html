/**
 * A planar path described like a turtle: from a start point and heading (radians, in the floor
 * plane: 0 = +x, pi/2 = +z), a list of [length, turn, rise] arcs. Returns a function giving the
 * position and heading at any distance along it.
 */
export function turtle(start, heading, arcs) {
  const segs = []
  let p = [...start]
  let h = heading
  let s0 = 0
  for (const [len, turn = 0, rise = 0] of arcs) {
    segs.push({ s0, len, p: [...p], h, turn, rise })
    // advance to the end of the arc
    const end = arcPoint(p, h, len, turn, rise, len)
    p = end.p
    h = end.h
    s0 += len
  }
  const total = s0
  return {
    total,
    at(s) {
      if (s <= 0) return { p: [...start], h: heading }
      for (const g of segs) if (s <= g.s0 + g.len + 1e-9) return arcPoint(g.p, g.h, g.len, g.turn, g.rise, s - g.s0)
      // past the end: straight on
      const last = segs[segs.length - 1]
      const e = arcPoint(last.p, last.h, last.len, last.turn, last.rise, last.len)
      const extra = s - total
      return { p: [e.p[0] + Math.cos(e.h) * extra, e.p[1], e.p[2] + Math.sin(e.h) * extra], h: e.h }
    },
  }
}
function arcPoint(p, h, len, turn, rise, s) {
  const y = p[1] + (rise * s) / len
  if (Math.abs(turn) < 1e-9) return { p: [p[0] + Math.cos(h) * s, y, p[2] + Math.sin(h) * s], h }
  const k = turn / len // curvature
  const h2 = h + k * s
  return { p: [p[0] + (Math.sin(h2) - Math.sin(h)) / k, y, p[2] - (Math.cos(h2) - Math.cos(h)) / k], h: h2 }
}

/**
 * Lay the whole rig out along a plan (see HERO), everything at rest, ready to drop.
 * Returns the routes, for inspection.
 */
export function placeLayout(rig, plan) {
  const up = [0, 1, 0]
  const crossV = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]
  const dir = (h) => [Math.cos(h), 0, Math.sin(h)]
  const B = rig.byName
  const pose = (body, axisLocal, axisWorld, sideLocal, sideWorld) => rotationFrom(axisLocal, sideLocal, axisWorld, sideWorld)
  const placeAt = (body, pinKey, pinWorld, R) => {
    const pin = body.pins[pinKey].s
    const off = Rig.poseToWorld(body, [0, 0, 0], R, pin)
    const c = [pinWorld[0] - off[0], pinWorld[1] - off[1], pinWorld[2] - off[2]]
    rig.placeBody(body, c, R)
    return c
  }
  const pinWorld = (body, key) => rig.pointOf(body, body.pins[key].b, new Float64Array(3))
  const lay = (chainName, route, offsetSide = 0, reverse = false, startAt = 0) => {
    const ch = rig.chains.find((c) => c.name === chainName)
    const pts = []
    for (let k = 1; k <= ch.ids.length; k++) {
      const s = startAt + k * ch.rest
      const q = route.at(s)
      const side = crossV(dir(q.h), up)
      pts.push([q.p[0] + side[0] * offsetSide, q.p[1], q.p[2] + side[2] * offsetSide])
    }
    if (reverse) pts.reverse()
    rig.placeChain(ch, pts)
    return ch
  }

  // the splitter, its leads leaving the top along `heading`
  const S = plan.splitter
  const d0 = dir(S.heading)
  const Rs = pose(B.splitter, [0, 1, 0], d0, [1, 0, 0], crossV(d0, up))
  rig.placeBody(B.splitter, S.p, Rs)
  const top = Rig.poseToWorld(B.splitter, S.p, Rs, [0, B.splitter.pins.left.s[1], 0])
  // both leads together to the bead
  const shared = turtle(top, S.heading, plan.shared)
  const atBead = shared.at(shared.total)
  const db = dir(atBead.h)
  const Rb = pose(B.bead, [0, 1, 0], db, [1, 0, 0], crossV(db, up))
  rig.placeBody(B.bead, atBead.p, Rb)
  // left lead: bead -> remote, the remote, remote -> bud
  const leftHole = pinWorld(B.bead, 'left')
  const l2 = turtle(leftHole, atBead.h, plan.leadL2)
  const end2 = l2.at(l2.total)
  const dr = dir(end2.h)
  const Rr = pose(B.remote, [0, 1, 0], dr, [0, 0, 1], up)
  placeAt(B.remote, 'bottom', end2.p, Rr)
  const rtop = pinWorld(B.remote, 'top')
  const l1 = turtle(rtop, end2.h, plan.leadL1)
  const end1 = l1.at(l1.total)
  // the bud: its cable leaves it back along the route; chosen face down
  const budPose = (body, endH, face) => {
    const back = dir(endH + Math.PI)
    const m = body.mirror
    // local direction of the face that should end up underneath
    const faceLocal = face === 'outer' ? [-m, 0, 0] : [m, 0, 0]
    return pose(body, body.pins.cable.dir, back, faceLocal, [0, -1, 0])
  }
  placeAt(B.budL, 'cable', end1.p, budPose(B.budL, end1.h, plan.roll.budL))
  // right lead: bead -> bud
  const rightHole = pinWorld(B.bead, 'right')
  const lr = turtle(rightHole, atBead.h, plan.leadR)
  const endR = lr.at(lr.total)
  placeAt(B.budR, 'cable', endR.p, budPose(B.budR, endR.h, plan.roll.budR))
  // main cable: from the splitter's bottom, away from the leads, to the plug
  const bottom = pinWorld(B.splitter, 'main')
  const mainRoute = turtle(bottom, S.heading + Math.PI, plan.main)
  const endM = mainRoute.at(mainRoute.total)
  const dm = dir(endM.h)
  const Rp = pose(B.plug, [0, -1, 0], dm, [0, 0, 1], up)
  placeAt(B.plug, 'cable', endM.p, Rp)

  // the cable particles along their routes. The shared stretch: the leads side by side
  const sharedLeft = { total: shared.total + l2.total, at: (s) => (s <= shared.total ? shared.at(s) : l2.at(s - shared.total)) }
  // leadL2 runs remote -> splitter: lay it from the splitter end and reverse
  const chL2 = rig.chains.find((c) => c.name === 'leadL2')
  const pts = []
  for (let k = 1; k <= chL2.ids.length; k++) {
    const s = k * chL2.rest
    const q = sharedLeft.at(s)
    const side = crossV(dir(q.h), up)
    const off = s <= shared.total ? -B.bead.pins.right.s[0] : 0
    pts.push([q.p[0] + side[0] * off, q.p[1], q.p[2] + side[2] * off])
  }
  rig.placeChain(chL2, pts.reverse())
  const chR = rig.chains.find((c) => c.name === 'leadR')
  const ptsR = []
  for (let k = 1; k <= chR.ids.length; k++) {
    const s = k * chR.rest
    const q = s <= shared.total ? shared.at(s) : lr.at(s - shared.total)
    const side = crossV(dir(q.h), up)
    const off = s <= shared.total ? B.bead.pins.right.s[0] : 0
    ptsR.push([q.p[0] + side[0] * off, q.p[1], q.p[2] + side[2] * off])
  }
  rig.placeChain(chR, ptsR.reverse())
  // leadL1 runs bud -> remote: reverse
  const chL1 = rig.chains.find((c) => c.name === 'leadL1')
  const p1 = []
  for (let k = 1; k <= chL1.ids.length; k++) p1.push(l1.at(k * chL1.rest).p)
  rig.placeChain(chL1, p1.reverse())
  const chM = rig.chains.find((c) => c.name === 'main')
  const pm = []
  for (let k = 1; k <= chM.ids.length; k++) pm.push(mainRoute.at(k * chM.rest).p)
  rig.placeChain(chM, pm)
  for (const b of rig.bodies) b.contact = false
  rig.wake()
  return { shared, l2, l1, lr, mainRoute }
}

/** A dense Catmull-Rom curve through points, as a polyline with its arc length. */
function densePath(ctrl, per = 24) {
  const P = (i) => ctrl[Math.max(0, Math.min(ctrl.length - 1, i))]
  const out = []
  for (let i = 0; i < ctrl.length - 1; i++)
    for (let s = 0; s < per; s++) {

  const baseAcc = arcLengths(base)
  const total0 = baseAcc[baseAcc.length - 1]

    return base.map((p, i) => {
      const j = Math.min(base.length - 1, i + 1)
      const k = Math.max(0, i - 1)
      let tx = base[j][0] - base[k][0]
      let tz = base[j][2] - base[k][2]

      tz /= tl

  const total = acc[acc.length - 1]

    const s = (q / (count + 1)) * total
    while (j < pts.length - 2 && acc[j + 1] < s) j++

/**

    const da = pinDir(ch.from.body, Object.keys(ch.from.body.pins).find((k) => ch.from.body.pins[k] === ch.from.point))

/**
 * Turns for a chain of arcs (fixed lengths) that starts at a, heading h0, and ends at b heading
 * h1, staying as close as it can to the preferred turns: a small least-squares solve
 * (Levenberg-Marquardt, numerical Jacobian).
 */
export function solveTurns(a, h0, b, h1, lens, prefIn, weight = 0.15, via = []) {
  const n = lens.length
  // the turns must add up to the change of heading (the branch nearest the preferred total):
  // shift the preferences evenly so they do
  const want = prefIn.reduce((x, y) => x + y, 0)
  let total = h1 - h0
  total += Math.round((want - total) / (2 * Math.PI)) * 2 * Math.PI
  const pref = prefIn.map((t) => t + (total - want) / n)
  const turns = pref.slice()
  const marks = new Array(n).fill(null)
  const endOf = (tr) => {
    let x = a[0]
    let z = a[2]
    let h = h0
    for (let i = 0; i < n; i++) {
      if (i > 0) marks[i - 1] = [x, z]
      const L = lens[i]
      const k = tr[i] / L
      if (Math.abs(tr[i]) < 1e-9) {
        x += Math.cos(h) * L
        z += Math.sin(h) * L
      } else {
        const h2 = h + tr[i]
        x += (Math.sin(h2) - Math.sin(h)) / k
        z -= (Math.cos(h2) - Math.cos(h)) / k
        h = h2
      }
    }
    return [x, z, h]
  }
  const wrap = (v) => Math.atan2(Math.sin(v), Math.cos(v))
  const res = (tr) => {
    const [x, z, h] = endOf(tr)
    // the ends must be met; the preferred turns only shape the way between
    const r = [(x - b[0]) * 20, (z - b[2]) * 20, wrap(h - h1) * 400]
    for (let i = 0; i < n; i++) r.push((tr[i] - pref[i]) * weight * 10)
    // soft waypoints: where some arcs should end
    for (const [i, vx, vz, wv = 1] of via) {
      const m = marks[i]
      r.push((m[0] - vx) * wv, (m[1] - vz) * wv)
    }
    return r
  }
  let lambda = 1e-2
  let r = res(turns)
  let cost = r.reduce((s, v) => s + v * v, 0)
  for (let it = 0; it < 200; it++) {
    // Jacobian
    const J = []
    for (let i = 0; i < n; i++) {
      const t2 = turns.slice()
      t2[i] += 1e-5
      const r2 = res(t2)
      J.push(r2.map((v, k) => (v - r[k]) / 1e-5))
    }
    // normal equations (J^T J + lambda diag) d = -J^T r
    const A = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => J[i].reduce((s, v, k) => s + v * J[j][k], 0)))
    const g = J.map((col) => col.reduce((s, v, k) => s + v * r[k], 0))
    for (let i = 0; i < n; i++) A[i][i] *= 1 + lambda
    // solve
    const M = A.map((row, i) => [...row, -g[i]])
    for (let i = 0; i < n; i++) {
      let p = i
      for (let q = i + 1; q < n; q++) if (Math.abs(M[q][i]) > Math.abs(M[p][i])) p = q
      ;[M[i], M[p]] = [M[p], M[i]]
      for (let q = i + 1; q < n; q++) {
        const f = M[q][i] / M[i][i]
        for (let c = i; c <= n; c++) M[q][c] -= f * M[i][c]
      }
    }
    const d = new Array(n).fill(0)
    for (let i = n - 1; i >= 0; i--) {
      let s = M[i][n]
      for (let c = i + 1; c < n; c++) s -= M[i][c] * d[c]
      d[i] = s / M[i][i]
    }
    const t2 = turns.map((v, i) => v + d[i])
    const r2 = res(t2)
    const c2 = r2.reduce((s, v) => s + v * v, 0)
    if (c2 < cost) {
      for (let i = 0; i < n; i++) turns[i] = t2[i]
      r = r2
      cost = c2
      lambda *= 0.4
      if (d.every((v) => Math.abs(v) < 1e-8)) break
    } else lambda *= 4
  }
  const [x, z, h] = endOf(turns)
  return { turns, miss: Math.hypot(x - b[0], z - b[2]), headingMiss: Math.abs(wrap(h - h1)) }
}

/**
 * Lay the rig out: bodies at explicit poses (as placePlan), each cable a chain of arcs whose turns

export function placeSolved(rig, plan) {

  const pinW = (body, key) => [...rig.pointOf(body, body.pins[key].b, new Float64Array(3))]

    const R = body.R

    // heights: from one pin's height to the other's, plus any lift
    const lift = spec.map((s) => s[2] || 0)
    const y = (s) => {
      let acc = 0
      let extra = 0
      for (let i = 0; i < lens.length; i++) {
        if (s >= acc && s <= acc + lens[i]) extra = lift[i] * Math.sin((Math.PI * (s - acc)) / lens[i])
        acc += lens[i]
      }

    }
    const r = { name, at: (s) => { const q = tr.at(s); return [q.p[0], y(s), q.p[2]] }, length }

  }

    const fk = keyOf(ch.from.body, ch.from.point)
    const tk = keyOf(ch.to.body, ch.to.point)
    const a = pinW(ch.from.body, fk)
    const b = pinW(ch.to.body, tk)
    const ha = headingOf(pinDirW(ch.from.body, fk))
    const hb = headingOf(pinDirW(ch.to.body, tk)) + Math.PI // arriving: against the pin's exit direction
    const spec = plan.routes[ch.name]
    if (!ch.bead) {
      const r = route(ch.name, a, ha, b, hb, spec.arcs, ch.length, spec.via)
      rig.placeChain(ch, ch.ids.map((_, k) => r.at((k + 1) * ch.rest)))
      continue
    }
    const hk = keyOf(ch.bead.body, ch.bead.hole)
    const hole = pinW(ch.bead.body, hk)
    const Rb = ch.bead.body.R
    const axisH = headingOf([Rb[3], Rb[4], Rb[5]]) // the bead's +y: towards the buds
    const kb = ch.ids.indexOf(ch.bead.i)
    const L1 = (kb + 1) * ch.rest
    const r1 = route(ch.name + ' to bead', a, ha, hole, axisH + Math.PI, spec.arcs, L1, spec.via)
    const r2 = route(ch.name + ' bead on', hole, axisH + Math.PI, b, hb, spec.arcs2 || [[1, 0], [1, 0], [1, 0], [1, 0]], ch.length - L1)
    rig.placeChain(ch, ch.ids.map((_, k) => (k < kb ? r1.at((k + 1) * ch.rest) : k === kb ? hole : r2.at((k - kb) * ch.rest))))
  }
  rig.wake()
  return report
}

/** A seamless cyclorama: the floor curves up into the wall behind. */
function cyclorama() {
  const { zc, R } = { zc: -380, R: 260 }
  // the profile, front to back and up: [z, y, nz, ny]
  const prof = []
  for (let z = 1600; z > zc; z -= 40) prof.push([z, 0, 0, 1])
  for (let k = 0; k <= 48; k++) {
    const a = (k / 48) * (Math.PI / 2)
    prof.push([zc - Math.sin(a) * R, R - Math.cos(a) * R, Math.sin(a), Math.cos(a)])
  }
  for (let y = R + 60; y <= 2600; y += 80) prof.push([zc - R, y, 1, 0])
  const xs = []
  for (let x = -2600; x <= 2600; x += 80) xs.push(x)
  const pos = []
  const nrm = []
  const col = []
  const centre = new THREE.Vector3(10, 0, -70)
  for (const [z, y, nz, ny] of prof)
    for (const x of xs) {
      pos.push(x, y, z)
      nrm.push(0, ny, nz)
      // a soft radial falloff from the middle of the set
      const d = Math.hypot(x - centre.x, (y - centre.y) * 0.8, z - centre.z)
      const k = 1 - 0.2 * THREE.MathUtils.smoothstep(d, 60, 900)
      col.push(k, k, k)
    }
  const idx = []
  const W = xs.length
  for (let r = 0; r + 1 < prof.length; r++)
    for (let i = 0; i + 1 < W; i++) {
      const a = r * W + i
      const b = a + W
      idx.push(a, a + 1, b, a + 1, b + 1, b)
    }
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3))
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3))
  g.setIndex(idx)
  return g
}

// ------------------------------------------------------------------------------------ textures
function canvasTex(w, h, draw, srgb = false) {
  const c = document.createElement('canvas')
  c.width = w
  c.height = h
  draw(c.getContext('2d'), w, h)
  const t = new THREE.CanvasTexture(c)
  if (srgb) t.colorSpace = THREE.SRGBColorSpace
  t.anisotropy = 8
  return t
}

/** The braid: a 2/2 twill of fine strands at 45 degrees, as a normal map, roughness map and a little colour. */
function braidMaps() {
  const S = 256
  const N = 8 // strands per family per tile
  const h = new Float32Array(S * S)
  for (let y = 0; y < S; y++)
    for (let x = 0; x < S; x++) {
      const u = (x + 0.5) / S
      const v = (y + 0.5) / S
      const strand = (cross, along, phase) => {
        const c = cross - Math.floor(cross)
        const prof = Math.sqrt(Math.max(0, 1 - (2 * c - 1) ** 2))
        // over two, under two
        const wave = Math.sin((Math.PI / 2) * (along + phase))
        return prof * 0.55 + wave * 0.3 * prof
      }
      const a = strand((u - v) * N, (u + v) * N, 0)
      const b = strand((u + v) * N, (u - v) * N, 1)
      h[y * S + x] = Math.max(a, b)
    }
  const nrm = new Uint8Array(S * S * 4)
  const rough = new Uint8Array(S * S * 4)
  const albedo = new Uint8Array(S * S * 4)
  const at = (x, y) => h[((y + S) % S) * S + ((x + S) % S)]
  // fibre noise along the strands
  let seed = 7
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
  const fib = new Float32Array(S * S)
  for (let i = 0; i < S * S; i++) fib[i] = rnd()
  for (let y = 0; y < S; y++)
    for (let x = 0; x < S; x++) {
      const dx = (at(x + 1, y) - at(x - 1, y)) * 2.2
      const dy = (at(x, y + 1) - at(x, y - 1)) * 2.2
      const l = Math.hypot(dx, dy, 1)
      const o = (y * S + x) * 4
      nrm[o] = Math.round((-dx / l * 0.5 + 0.5) * 255)
      nrm[o + 1] = Math.round((-dy / l * 0.5 + 0.5) * 255)
      nrm[o + 2] = Math.round((1 / l * 0.5 + 0.5) * 255)
      nrm[o + 3] = 255
      const hh = at(x, y)
      const f = (fib[o / 4] + fib[((y * S + ((x + 1) % S)))] + fib[(((y + 1) % S) * S + x)]) / 3
      const r = 0.84 - hh * 0.22 + (f - 0.5) * 0.06
      rough[o] = rough[o + 1] = rough[o + 2] = Math.round(THREE.MathUtils.clamp(r, 0, 1) * 255)
      rough[o + 3] = 255
      const a = 0.66 + hh * 0.34 + (f - 0.5) * 0.08
      albedo[o] = albedo[o + 1] = albedo[o + 2] = Math.round(THREE.MathUtils.clamp(a, 0, 1) * 255)
      albedo[o + 3] = 255
    }
  const mk = (data, srgb) => {
    const t = new THREE.DataTexture(data, S, S)
    t.wrapS = t.wrapT = THREE.RepeatWrapping
    t.magFilter = THREE.LinearFilter
    t.minFilter = THREE.LinearMipmapLinearFilter
    t.generateMipmaps = true
    t.anisotropy = 8
    if (srgb) t.colorSpace = THREE.SRGBColorSpace
    t.needsUpdate = true
    return t
  }
  return { normal: mk(nrm), rough: mk(rough), albedo: mk(albedo, true) }
}
const BRAID_TILE = (2 * Math.PI * G.CABLE.radius) / 2 // two tiles round the cable
const braid = braidMaps()

/** Perforated metal: round holes on a staggered grid, as alpha (holes clear) and a little shading. */
function perforatedMaps() {
  const S = 128
  const alpha = canvasTex(S, S, (x, w) => {
    x.fillStyle = '#fff'
    x.fillRect(0, 0, w, w)
    x.fillStyle = '#000'
    const n = 6
    const p = w / n
    for (let j = 0; j <= n; j++)
      for (let i = 0; i <= n; i++) {
        const cx = i * p + (j % 2 ? p / 2 : 0)
        const cy = j * p * 1
        x.beginPath()
        x.arc(cx, cy, p * 0.31, 0, Math.PI * 2)
        x.fill()
      }
  })
  alpha.wrapS = alpha.wrapT = THREE.RepeatWrapping
  return alpha
}
const perfAlpha = perforatedMaps()

/** The etched letters, as masks (white = etched). */
const letterTex = (ch) =>

/** USB-C contact pads on the tongue: metalness / colour pattern. */

  for (let i = 0; i < 12; i++) {

// ------------------------------------------------------------------------------------ materials
const NOISE_GLSL = /* glsl */ `
  float dwHash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  float dwNoise(vec3 x) {
    vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(dwHash(i), dwHash(i + vec3(1,0,0)), f.x), mix(dwHash(i + vec3(0,1,0)), dwHash(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(dwHash(i + vec3(0,0,1)), dwHash(i + vec3(1,0,1)), f.x), mix(dwHash(i + vec3(0,1,1)), dwHash(i + vec3(1,1,1)), f.x), f.y), f.z);
  }
`
/**
 * Moulded plastic: satin, with a faint noise in its roughness (no sterile highlights), a parting
 * line groove (a plane through the part), and optionally a laser-etched letter. The groove and the
 * letter change roughness, colour and the normal; they are not separate geometry.
 */
function plasticMaterial(opts) {
  const m = new THREE.MeshPhysicalMaterial({
    color: opts.color,
    roughness: opts.roughness ?? 0.35,
    metalness: 0,
    clearcoat: 0.25,
    clearcoatRoughness: 0.24,
    vertexColors: !!opts.ao,
  })
  const u = {
    uMirror: { value: opts.mirror ? -1 : 1 },
    uNoise: { value: opts.noise ?? 0.07 },
    uGroove: { value: new THREE.Vector4(...(opts.groove || [0, 0, 1, 1e6])) },
    uEtch: { value: opts.letter || LETTERS.L },
    uEtchOn: { value: opts.letter ? 1 : 0 },
    uEtchO: { value: new THREE.Vector3(...(opts.etch?.o || [0, 0, 0])) },
    uEtchU: { value: new THREE.Vector3(...(opts.etch?.u || [1, 0, 0])) },
    uEtchV: { value: new THREE.Vector3(...(opts.etch?.v || [0, 1, 0])) },
  }
  m.userData.u = u
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, u)
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vObj;\nvarying vec3 vGrooveN;\nvarying vec3 vEtchU;\nvarying vec3 vEtchV;\nuniform float uMirror;\nuniform vec4 uGroove;\nuniform vec3 uEtchU;\nuniform vec3 uEtchV;')
      .replace(
        '#include <begin_vertex>',
        `#include <begin_vertex>
        vObj = position;
        vGrooveN = normalize(normalMatrix * vec3(uGroove.x * uMirror, uGroove.y, uGroove.z));
        vEtchU = normalize(normalMatrix * vec3(uEtchU.x * uMirror, uEtchU.y, uEtchU.z));
        vEtchV = normalize(normalMatrix * vec3(uEtchV.x * uMirror, uEtchV.y, uEtchV.z));`,
      )
    sh.fragmentShader = sh.fragmentShader
      .replace(
        '#include <common>',
        `#include <common>
        varying vec3 vObj; varying vec3 vGrooveN; varying vec3 vEtchU; varying vec3 vEtchV;
        uniform float uMirror; uniform float uNoise; uniform vec4 uGroove;
        uniform sampler2D uEtch; uniform float uEtchOn; uniform vec3 uEtchO; uniform vec3 uEtchU; uniform vec3 uEtchV;
        ${NOISE_GLSL}`,
      )
      .replace(
        '#include <color_fragment>',
        `#include <color_fragment>
        // design-frame position (mirrored parts read their mirror image)
        vec3 pD = vec3(vObj.x * uMirror, vObj.y, vObj.z);
        float dwN = dwNoise(pD * 2.7) * 0.6 + dwNoise(pD * 9.0) * 0.4;
        // the parting line: a 0.1 mm groove, faded to an average when it is below a pixel
        float gd = dot(pD, uGroove.xyz) - uGroove.w;
        float gw = fwidth(gd);
        float groove = 1.0 - smoothstep(0.03, 0.065, abs(gd));
        float gAA = clamp(0.05 / max(gw, 1e-4), 0.0, 1.0);
        groove = mix(0.1 * (1.0 - smoothstep(0.0, 0.2 + gw, abs(gd))), groove, gAA);
        diffuseColor.rgb *= 1.0 - 0.45 * groove;
        // the etched letter
        vec2 euv = vec2(dot(pD - uEtchO, uEtchU), dot(pD - uEtchO, uEtchV)) + 0.5;
        float etch = 0.0;
        if (uEtchOn > 0.5 && euv.x > 0.0 && euv.y > 0.0 && euv.x < 1.0 && euv.y < 1.0) etch = texture2D(uEtch, euv).r;
        diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * 0.72 + vec3(0.06), etch * 0.85);`,
      )
      .replace(
        '#include <roughnessmap_fragment>',
        `#include <roughnessmap_fragment>
        roughnessFactor = clamp(roughnessFactor + (dwN - 0.5) * uNoise, 0.05, 1.0);
        roughnessFactor = mix(roughnessFactor, min(1.0, roughnessFactor + 0.3), groove);
        roughnessFactor = mix(roughnessFactor, 0.78, etch);`,
      )
      .replace(
        '#include <normal_fragment_maps>',
        `#include <normal_fragment_maps>
        {
          // the groove's walls lean towards its middle
          float t = clamp((abs(gd) - 0.03) / 0.035, 0.0, 1.0);
          float slope = sign(gd) * 6.0 * t * (1.0 - t) * gAA;
          vec3 T = vGrooveN - dot(vGrooveN, normal) * normal;
          normal = normalize(normal - T * slope * 1.6);
          // the letter's edges, from the mask's gradient
          if (etch > 0.0 || uEtchOn > 0.5) {
            vec2 d = vec2(dFdx(etch), dFdy(etch));
            float e1 = texture2D(uEtch, euv + vec2(0.012, 0.0)).r - texture2D(uEtch, euv - vec2(0.012, 0.0)).r;
            float e2 = texture2D(uEtch, euv + vec2(0.0, 0.012)).r - texture2D(uEtch, euv - vec2(0.0, 0.012)).r;
            float inside = step(0.0, euv.x) * step(0.0, euv.y) * step(euv.x, 1.0) * step(euv.y, 1.0) * uEtchOn;
            normal = normalize(normal + (vEtchU * e1 + vEtchV * e2) * 0.35 * inside);
          }
        }`,
      )
      .replace(
        '#include <lights_physical_fragment>',
        `#include <lights_physical_fragment>
        #ifdef USE_CLEARCOAT
          material.clearcoat *= (1.0 - groove) * (1.0 - 0.9 * etch);
        #endif`,
      )
  }
  m.customProgramCacheKey = () => 'dw-plastic'
  return m
}

const mats = {}
function makeMaterials() {
  const C = COLORWAYS.graphite
  const B = G.BUD
  // the letter on the stem's inner face, upright for someone looking at it with the stem down
  const sa = 10.4
  const st = G.stemAt(sa)
  const up = [-B.stem.dir[0], -B.stem.dir[1], -B.stem.dir[2]]
  const right = [-B.stem.wide[0], -B.stem.wide[1], -B.stem.wide[2]]
  const size = 1.9
  const etch = (mirror) => ({
    o: [st.p[0] + st.rx + 0.05, st.p[1], st.p[2]],
    u: right.map((c) => (c / size) * (mirror ? -1 : 1)),
    v: up.map((c) => c / size),
  })
  const groove = [1, 0, 0, B.parting.x]
  mats.budL = plasticMaterial({ color: C.body, ao: true, groove, letter: LETTERS.L, etch: etch(false) })
  mats.budR = plasticMaterial({ color: C.body, ao: true, groove, letter: LETTERS.R, etch: etch(true), mirror: true })
  mats.remote = plasticMaterial({ color: C.body, ao: true, groove: [0, 0, 1, G.REMOTE.seamZ] })
  mats.plastic = plasticMaterial({ color: C.body })
  // translucent silicone: what is behind the tip shows through, smoked by the silicone's colour
  mats.tip = new THREE.MeshPhysicalMaterial({

  tipColors(new THREE.Color(C.tip))
  mats.accent = new THREE.MeshPhysicalMaterial({ color: C.accent, metalness: 1, roughness: 0.26, anisotropy: 0.7, anisotropyRotation: 0, clearcoat: 0.1, clearcoatRoughness: 0.3 })
  mats.steel = new THREE.MeshPhysicalMaterial({ color: '#c7c9cb', metalness: 1, roughness: 0.12 })
  mats.rubber = new THREE.MeshPhysicalMaterial({ color: C.rubber, roughness: 0.62, metalness: 0, sheen: 0.35, sheenRoughness: 0.6, sheenColor: new THREE.Color(C.rubber).lerp(new THREE.Color('#ffffff'), 0.25), specularIntensity: 0.5 })
  mats.mesh = new THREE.MeshPhysicalMaterial({

  mats.contacts = new THREE.MeshPhysicalMaterial({ map: contactsTex, metalness: 0.6, roughness: 0.35, color: '#f2f2f2' })
  mats.cable = new THREE.MeshPhysicalMaterial({

}

/** The tip's colours from its colourway's: a light base, smoked by the volume's colour. */
function tipColors(c) {
  const white = new THREE.Color('#ffffff')
  mats.tip.color.copy(c).lerp(white, 0.14)
  mats.tip.attenuationColor.copy(c).lerp(white, 0.4)
  mats.tip.sheenColor.copy(c).lerp(white, 0.2)
}

/** Colourway: every material eased towards its new colour. */
const colorTween = { t: 1, from: null, to: null }
const tipNow = new THREE.Color(COLORWAYS.graphite.tip)
function snapshotColors() {
  return {
    body: mats.budL.color.clone(),
    tip: tipNow.clone(),
    accent: mats.accent.color.clone(),
    braid: mats.cable.color.clone(),
    rubber: mats.rubber.color.clone(),
    bodyRough: mats.budL.roughness,
  }
}
let colorway = 'graphite'
function setColorway(name, instant = false) {
  colorway = name
  const C = COLORWAYS[name]
  const to = {
    body: new THREE.Color(C.body),
    tip: new THREE.Color(C.tip),
    accent: new THREE.Color(C.accent),
    braid: new THREE.Color(C.braid),
    rubber: new THREE.Color(C.rubber),
    bodyRough: C.bodyRough,
  }
  colorTween.from = snapshotColors()
  colorTween.to = to
  colorTween.t = instant ? 1 : 0
  applyColors(instant ? 1 : 0)
  for (const b of document.querySelectorAll('.swatch')) b.setAttribute('aria-pressed', String(b.dataset.colorway === name))
  $('colorname').textContent = C.name
  requestRender()
}
function applyColors(t) {
  const { from, to } = colorTween
  if (!from) return
  const e = t * t * (3 - 2 * t)
  const mix = (a, b) => a.clone().lerp(b, e)
  const body = mix(from.body, to.body)
  for (const m of [mats.budL, mats.budR, mats.remote, mats.plastic]) {
    m.color.copy(body)
    m.roughness = THREE.MathUtils.lerp(from.bodyRough, to.bodyRough, e)
  }
  tipNow.copy(mix(from.tip, to.tip))
  tipColors(tipNow)
  mats.accent.color.copy(mix(from.accent, to.accent))
  const br = mix(from.braid, to.braid)
  mats.cable.color.copy(br)
  mats.cable.sheenColor.copy(br).lerp(new THREE.Color('#ffffff'), 0.18)
  const ru = mix(from.rubber, to.rubber)
  mats.rubber.color.copy(ru)
  mats.rubber.sheenColor.copy(ru).lerp(new THREE.Color('#ffffff'), 0.25)
}

// ------------------------------------------------------------------------------------ geometry builders
function meshGeometry(m) {
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.BufferAttribute(m.positions, 3))
  g.setAttribute('normal', new THREE.BufferAttribute(m.normals, 3))
  const n = m.ao.length
  const col = new Float32Array(n * 3)
  for (let i = 0; i < n; i++) col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = 0.35 + 0.65 * m.ao[i]
  g.setAttribute('color', new THREE.BufferAttribute(col, 3))
  g.setIndex(new THREE.BufferAttribute(m.indices, 1))
  g.computeBoundingSphere()
  return g
}
/** Mirror a geometry in x: positions, normals, winding. */
function mirrorX(src) {
  const g = src.clone()
  const p = g.attributes.position.array
  const n = g.attributes.normal.array
  for (let i = 0; i < p.length; i += 3) {
    p[i] = -p[i]
    n[i] = -n[i]
  }
  if (g.index) {
    const idx = g.index.array
    for (let i = 0; i < idx.length; i += 3) {
      const t = idx[i + 1]
      idx[i + 1] = idx[i + 2]
      idx[i + 2] = t
    }
  }
  g.computeBoundingSphere()
  return g
}
/**
 * A turned part: a profile of [radius, axial] points (with an optional smooth flag), revolved;
 * corners keep two vertices so their edges stay crisp. Optional oval cross-section (sx, sz scale).
 * UVs: u round, v along the profile.
 */
function lathe(profile, segments = 64, sx = 1, sz = 1, closedLoop = false) {
  const segN = (a, b) => {
    const dr = b[0] - a[0]
    const dy = b[1] - a[1]
    const l = Math.hypot(dr, dy) || 1
    return [dy / l, -dr / l]
  }
  // a closed profile must run counter-clockwise (r right, y up), so its normals face out
  if (closedLoop) {
    let area = 0
    for (let i = 0; i < profile.length; i++) {
      const a = profile[i]
      const b = profile[(i + 1) % profile.length]
      area += a[0] * b[1] - b[0] * a[1]
    }
    if (area < 0) profile = [...profile].reverse()
  }
  const pts = closedLoop ? [...profile, profile[0]] : profile
  const rows = []
  let acc = 0
  for (let i = 0; i < pts.length; i++) {
    if (i > 0) acc += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])
    const [r, y, smooth = true] = pts[i]
    let a = i > 0 ? segN(pts[i - 1], pts[i]) : null
    let b = i < pts.length - 1 ? segN(pts[i], pts[i + 1]) : null
    if (closedLoop && i === 0) a = segN(pts[pts.length - 2], pts[0])
    if (closedLoop && i === pts.length - 1) b = segN(pts[0], pts[1])
    if (a && b && smooth) {
      const l = Math.hypot(a[0] + b[0], a[1] + b[1]) || 1
      rows.push([r, y, (a[0] + b[0]) / l, (a[1] + b[1]) / l, acc])
    } else {
      if (a) rows.push([r, y, ...a, acc])
      if (b) rows.push([r, y, ...b, acc])
    }
  }
  const pos = []
  const nrm = []
  const uv = []
  for (const [r, y, nr, ny, s] of rows)
    for (let j = 0; j <= segments; j++) {
      const t = (j / segments) * Math.PI * 2
      const cs = Math.cos(t)
      const sn = Math.sin(t)
      pos.push(r * cs * sx, y, r * sn * sz)
      const nx = nr * cs / sx
      const nz = nr * sn / sz
      const l = Math.hypot(nx, ny, nz) || 1
      nrm.push(nx / l, ny / l, nz / l)
      uv.push(j / segments, s)
    }
  const idx = []
  const W = segments + 1
  for (let i = 0; i + 1 < rows.length; i++)
    for (let j = 0; j < segments; j++) {
      const a = i * W + j
      const b = a + W
      idx.push(a, b, a + 1, a + 1, b, b + 1)
    }
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3))
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2))
  g.setIndex(idx)
  g.computeBoundingSphere()
  return g
}
/** A smooth closed or open profile from a few control points (Catmull-Rom), evenly resampled. */
function smoothProfile(ctrl, count, closed = false) {
  const P = (i) => (closed ? ctrl[(i + ctrl.length) % ctrl.length] : ctrl[Math.max(0, Math.min(ctrl.length - 1, i))])
  const dense = []
  const nSeg = closed ? ctrl.length : ctrl.length - 1
  for (let i = 0; i < nSeg; i++)
    for (let s = 0; s < 20; s++) {
      const t = s / 20
      const p0 = P(i - 1)
      const p1 = P(i)
      const p2 = P(i + 1)
      const p3 = P(i + 2)
      dense.push([0, 1].map((k) => 0.5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t * t + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t * t * t)))
    }
  if (!closed) dense.push(ctrl[ctrl.length - 1])
  const acc = [0]
  for (let i = 1; i < dense.length; i++) acc.push(acc[i - 1] + Math.hypot(dense[i][0] - dense[i - 1][0], dense[i][1] - dense[i - 1][1]))
  const total = acc[acc.length - 1]
  const out = []
  let j = 0
  for (let q = 0; q < count; q++) {
    const s = (q / (closed ? count : count - 1)) * total
    while (j < dense.length - 2 && acc[j + 1] < s) j++
    const t = (s - acc[j]) / (acc[j + 1] - acc[j] || 1)
    out.push([dense[j][0] + (dense[j + 1][0] - dense[j][0]) * t, dense[j][1] + (dense[j + 1][1] - dense[j][1]) * t])
  }
  return out
}
/** A matrix placing a part's local y axis along `axis` at `origin` (local x as near `side` as it can). */
function frameMatrix(origin, axis, side) {
  const y = new THREE.Vector3(...axis).normalize()
  const x = new THREE.Vector3(...side)
  x.addScaledVector(y, -x.dot(y)).normalize()
  const z = new THREE.Vector3().crossVectors(x, y)
  return new THREE.Matrix4().makeBasis(x, y, z).setPosition(...origin)
}
const solid = (geo, mat, castShadow = true) => {
  const m = new THREE.Mesh(geo, mat)
  m.castShadow = castShadow
  m.receiveShadow = true
  return m
}

// ---- the earbud's turned and flat parts, in the design frame (left bud)
function earTipGeometry() {
  const T = G.BUD.nozzle.tip
  const f = T.front
  const s = T.skirt
  const R = T.radius - 0.04
  const w = T.wall
  // a bell: close to half an ellipse, widest at its mouth, with a flat lip round the hole; the
  // inside follows the outside one wall in, up to the sleeve that grips the nozzle
  const H = 7.0
  const y0 = s + 0.15
  const outer = (y) => R * Math.sqrt(Math.max(0, 1 - ((y - y0) / H) ** 2))
  const inner = (y) => (R - w) * Math.sqrt(Math.max(0, 1 - ((y - y0) / (H - w)) ** 2))
  const ctrl = [
    [2.06, f - 0.01], // the hole's rounded edge
    [2.4, f - 0.035],
  ]
  for (const d of [0.14, 0.45, 0.9, 1.5, 2.25, 3.1, 4.0, 4.9, 5.6]) ctrl.push([outer(f - d), f - d])
  // the mouth: a rounded edge one wall thick
  ctrl.push([R - 0.03, s + 0.42], [R - 0.1, s + 0.1], [R - w / 2, s], [R - w + 0.07, s + 0.1], [R - w, s + 0.42])
  for (const y of [s + 1.0, s + 2.0, s + 3.0, s + 4.0, s + 4.7]) ctrl.push([inner(y), y])
  ctrl.push(
    [3.1, f - 1.3], // the inside of the bell meets the sleeve
    [2.96, f - 1.8],
    [2.95, s + 2.45], // the sleeve's end
    [2.77, s + 2.12],
    [2.58, s + 2.45],
    [2.57, f - 0.75], // inside the sleeve, up to the lip in front of the nozzle
    [2.28, f - 0.5],
    [1.97, f - 0.32], // the hole
    [1.95, f - 0.14],
  )
  const prof = smoothProfile(ctrl, 260, true)
  return lathe(prof.map(([r, y]) => [r, y, true]), 96, 1, 1, true)
}

function placeOnNozzle(geo) {
  // lathe axis (y) onto the nozzle axis
  const N = G.BUD.nozzle
  const m = frameMatrix(N.base, N.dir, N.frame.u)
  geo.applyMatrix4(m)
  return geo
}

function flatShape(hu, hv, r, rot = 0) {
  const s = new THREE.Shape()
  if (r >= Math.min(hu, hv) - 1e-6) {
    // a stadium or ellipse
    s.absellipse(0, 0, hu, hv, 0, Math.PI * 2, false, rot)
    return s
  }
  s.moveTo(-hu + r, -hv)
  s.lineTo(hu - r, -hv)
  s.absarc(hu - r, -hv + r, r, -Math.PI / 2, 0)
  s.lineTo(hu, hv - r)
  s.absarc(hu - r, hv - r, r, 0, Math.PI / 2)
  s.lineTo(-hu + r, hv)
  s.absarc(-hu + r, hv - r, r, Math.PI / 2, Math.PI)
  s.lineTo(-hu, -hv + r)
  s.absarc(-hu + r, -hv + r, r, Math.PI, Math.PI * 1.5)
  return s
}
function stadiumShape(hu, hv) {
  const s = new THREE.Shape()
  const r = hv
  s.moveTo(-hu + r, -hv)
  s.lineTo(hu - r, -hv)
  s.absarc(hu - r, 0, r, -Math.PI / 2, Math.PI / 2)
  s.lineTo(-hu + r, hv)
  s.absarc(-hu + r, 0, r, Math.PI / 2, Math.PI * 1.5)
  return s
}
/** A flat shape set into a frame {o, u, v, w}, `depth` below its origin. UVs in mm / tile. */
function inFrame(shape, F, depth, tile) {
  const g = new THREE.ShapeGeometry(shape, 32)
  const uv = g.attributes.uv
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / tile, uv.getY(i) / tile)
  const m = new THREE.Matrix4().makeBasis(new THREE.Vector3(...F.u), new THREE.Vector3(...F.v), new THREE.Vector3(...F.w))
  m.setPosition(F.o[0] - F.w[0] * depth, F.o[1] - F.w[1] * depth, F.o[2] - F.w[2] * depth)
  g.applyMatrix4(m)
  return g
}

function ringGeometry() {
  // the accent ring: a rounded band in the stem's groove, following its oval section
  const B = G.BUD
  const R = B.ring
  const st = G.stemAt(R.at)
  const prof = []
  const hw = R.half - 0.03
  const t = 0.22 // radial thickness above the groove floor
  const rr = 0.11
  // profile in (radial offset from the groove floor, axial offset), round corners
  const corner = (cx, cy, a0, a1) => {
    for (let k = 0; k <= 6; k++) {
      const a = a0 + ((a1 - a0) * k) / 6
      prof.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr])
    }
  }
  corner(t - rr, hw - rr, 0, Math.PI / 2)
  corner(-0.05 + rr, hw - rr, Math.PI / 2, Math.PI)
  corner(-0.05 + rr, -hw + rr, Math.PI, 1.5 * Math.PI)
  corner(t - rr, -hw + rr, 1.5 * Math.PI, 2 * Math.PI)
  const seg = 96
  const pos = []
  const uv = []
  const rx0 = st.rx - R.depth
  const rw0 = st.rw - R.depth
  for (let i = 0; i <= prof.length; i++) {
    const [dr, da] = prof[i % prof.length]
    for (let j = 0; j <= seg; j++) {
      const th = (j / seg) * Math.PI * 2
      const ex = (rx0 + dr) * Math.cos(th)
      const ew = (rw0 + dr) * Math.sin(th)
      const a = R.at + da
      pos.push(
        B.stem.a[0] + B.stem.dir[0] * a + ex,
        B.stem.a[1] + B.stem.dir[1] * a + B.stem.wide[1] * ew,
        B.stem.a[2] + B.stem.dir[2] * a + B.stem.wide[2] * ew,
      )
      uv.push(j / seg, i / prof.length)
    }
  }
  const idx = []
  const W = seg + 1
  for (let i = 0; i < prof.length; i++)
    for (let j = 0; j < seg; j++) {
      const a = i * W + j
      const b = a + W
      idx.push(a, a + 1, b, a + 1, b + 1, b)
    }
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2))
  g.setIndex(idx)
  g.computeVertexNormals()
  return g
}

function bootGeometry() {
  // the stepped, tapered rubber boot: from its socket in the stem's flat end down to the cable
  const B = G.BUD
  const L = B.boot.len
  const face = B.stem.cut - B.boot.start // where the stem's end face is, along the boot
  const prof = [
    [0.0, face - 0.5],
    [1.42, face - 0.5],
    [1.42, face + 1.15, false],
    [1.39, face + 1.3],
    [1.32, face + 1.36, false],
    [1.3, face + 3.0, false],
    [1.27, face + 3.12],
    [1.22, face + 3.18, false],
    [1.2, face + 4.9],
    [1.15, L - 0.3],
    [1.12, L],
    [0.0, L],
  ].map(([r, y, smooth = true], i, arr) => [r, y, i > 0 && i < arr.length - 1 && smooth])
  const g = lathe(prof, 48)
  const m = frameMatrix(G.stemAt(B.boot.start).p, B.stem.dir, [1, 0, 0])
  g.applyMatrix4(m)
  return g
}

function makeEarbud(side, shell) {
  const mirror = side === 'right'
  const grp = new THREE.Group()
  const parts = []
  const B = G.BUD
  const body = solid(mirror ? mirrorX(shell) : shell, mirror ? mats.budR : mats.budL)
  parts.push(body)
  const tip = earTipGeometry()
  placeOnNozzle(tip)
  parts.push(solid(mirror ? mirrorX(tip) : tip, mats.tip))
  parts.push(solid(mirror ? mirrorX(ringGeometry()) : ringGeometry(), mats.accent))
  parts.push(solid(mirror ? mirrorX(bootGeometry()) : bootGeometry(), mats.rubber))
  // the vent: perforated mesh 0.3 mm down, a dark cavity under it
  const V = B.vent
  const ventMesh = inFrame(stadiumShape(V.hu + 0.06, V.hv + 0.06), V.frame, V.recess, 0.55)
  const ventCav = inFrame(stadiumShape(V.hu + 0.08, V.hv + 0.08), V.frame, V.depth - 0.06, 1)
  // the nozzle's mesh, inside the tip
  const N = B.nozzle
  const nf = { o: G.fromFrame(N.frame, 0, 0, N.len), u: N.frame.u, v: N.frame.v, w: N.dir }
  const ell = (a, b) => {
    const s = new THREE.Shape()
    s.absellipse(0, 0, a, b, 0, Math.PI * 2)
    return s
  }
  const nozMesh = inFrame(ell(N.hole.ru + 0.05, N.hole.rv + 0.05), nf, 0.45, 0.55)
  const nozCav = inFrame(ell(N.hole.ru + 0.06, N.hole.rv + 0.06), nf, N.hole.depth - 0.06, 1)
  for (const [g, m] of [
    [ventMesh, mats.mesh],
    [ventCav, mats.cavity],
    [nozMesh, mats.mesh],
    [nozCav, mats.cavity],
  ])
    parts.push(solid(mirror ? mirrorX(g) : g, m, false))
  for (const p of parts) grp.add(p)
  return grp
}

// ---- remote
function remoteCapGeometry(top) {
  // an oval metal cap from the body's end down to a round collar the cable leaves through
  const R = G.REMOTE
  const C = G.REMOTE_CAP
  const prof = []
  const n = 26
  for (let k = 0; k <= n; k++) {
    const t = k / n
    // radius (in the remote's half-width units) and height
    const a = t * (Math.PI / 2)
    const rr = 1 - 0.62 * (1 - Math.cos(a)) // from the full oval towards the collar
    const y = C.from - 0.25 + (C.to - C.from - 0.5) * Math.sin(a)
    prof.push([rr, y])
  }
  // the collar
  prof.push([0.36, C.to - 0.5], [0.34, C.to], [0, C.to])
  prof.unshift([0, C.from - 0.25])
  // build with a cross-section that blends from the oval (rx, rz) to round
  const seg = 64
  const pos = []
  const uv = []
  for (let i = 0; i < prof.length; i++) {
    const [s, y] = prof[i]
    const blend = THREE.MathUtils.clamp((y - C.from) / (C.to - C.from), 0, 1) ** 1.5
    const rx = s * (R.rx - 0.05)
    const rz = s * THREE.MathUtils.lerp(R.rz - 0.05, R.rx - 0.05, blend)
    for (let j = 0; j <= seg; j++) {
      const th = (j / seg) * Math.PI * 2
      pos.push(rx * Math.cos(th), top ? y : -y, rz * Math.sin(th))
      uv.push(j / seg, i / prof.length)
    }
  }
  const idx = []
  const W = seg + 1
  for (let i = 0; i + 1 < prof.length; i++)
    for (let j = 0; j < seg; j++) {
      const a = i * W + j
      const b = a + W
      if (top) idx.push(a, b, a + 1, a + 1, b, b + 1)
      else idx.push(a, a + 1, b, a + 1, b + 1, b)
    }
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2))
  g.setIndex(idx)
  g.computeVertexNormals()
  return g
}
function makeRemote(body) {
  const grp = new THREE.Group()
  grp.add(solid(body, mats.remote))
  grp.add(solid(remoteCapGeometry(true), mats.accent))
  grp.add(solid(remoteCapGeometry(false), mats.accent))
  return grp
}

// ---- splitter and bead
function makeSplitter() {
  const S = G.SPLITTER
  const grp = new THREE.Group()
  const h = S.half
  const body = lathe(
    [
      [0, -h],
      [S.r - 0.3, -h, false],
      [S.r - 0.05, -h + 0.3],
      [S.r, -h + 0.9],
      [S.r, h - 0.9],
      [S.r - 0.05, h - 0.3],
      [S.r - 0.3, h, false],
      [0, h],
    ],
    64,
  )
  grp.add(solid(body, mats.plastic))
  const cap = (sgn) => {
    const c = S.cap
    const prof = [
      [0, sgn * (h - 0.2)],
      [S.r - 0.12, sgn * (h - 0.2), false],
      [S.r - 0.12, sgn * (h + 0.15)],
      [S.r - 0.35, sgn * (h + c * 0.6)],
      [S.r - 1.0, sgn * (h + c - 0.05)],
      [S.r - 1.4, sgn * (h + c)],
      [0, sgn * (h + c)],
    ]
    if (sgn < 0) prof.reverse()
    return lathe(prof, 64)
  }
  grp.add(solid(cap(1), mats.accent))
  grp.add(solid(cap(-1), mats.accent))
  return grp
}
function makeBead() {
  const B = G.BEAD
  const prof = []
  const n = 14
  for (let k = 0; k <= n; k++) {
    const a = -Math.PI / 2 + (k / n) * Math.PI
    // a squarish barrel: straight sides, rounded ends
    const r = Math.cos(a) ** 0.35
    prof.push([r, Math.sin(a) * B.half])
  }
  prof.unshift([0, -B.half])
  prof.push([0, B.half])
  const g = lathe(prof.map(([r, y]) => [r * B.rx, y]), 64, 1, B.rz / B.rx)
  const grp = new THREE.Group()
  grp.add(solid(g, mats.accent))
  return grp
}

// ---- USB-C plug
function stadiumLoft(hw, hh, profile, segs = 72) {
  // a closed stadium cross-section (half width hw, half height hh) scaled along a profile of
  // [inset, y] points: a solid with rounded ends
  const pos = []
  const uv = []
  const ring = (inset, y, row) => {
    const w = hw - inset
    const h = Math.max(0.01, hh - inset)
    const straight = Math.max(0, w - h)
    for (let j = 0; j <= segs; j++) {
      const t = j / segs
      // walk the stadium perimeter
      const per = 4 * straight + 2 * Math.PI * h
      let s = t * per
      let x
      let z
      if (s < 2 * straight) {
        x = -straight + s
        z = h
      } else if (s < 2 * straight + Math.PI * h) {
        const a = (s - 2 * straight) / h
        x = straight + Math.sin(a) * h
        z = Math.cos(a) * h
      } else if (s < 4 * straight + Math.PI * h) {
        x = straight - (s - 2 * straight - Math.PI * h)
        z = -h
      } else {
        const a = (s - 4 * straight - Math.PI * h) / h
        x = -straight - Math.sin(a) * h
        z = -Math.cos(a) * h
      }
      pos.push(x, y, z)
      uv.push(t, row)
    }
  }
  profile.forEach(([inset, y], i) => ring(inset, y, i / profile.length))
  const idx = []
  const W = segs + 1
  for (let i = 0; i + 1 < profile.length; i++)
    for (let j = 0; j < segs; j++) {
      const a = i * W + j
      const b = a + W
      idx.push(a, b, a + 1, a + 1, b, b + 1)
    }
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2))
  g.setIndex(idx)
  g.computeVertexNormals()
  return g
}
function makePlug() {
  const Pp = G.PLUG
  const grp = new THREE.Group()
  // stepped strain relief (round), into the housing
  const steps = Pp.relief.steps
  const prof = [[0, Pp.relief.top]]
  for (let k = 0; k < steps.length; k++) {
    const [y, r] = steps[k]
    prof.push([r, y, k % 2 === 1])
  }
  prof.push([0, 0.2])
  prof.reverse() // bottom to top, so the faces look out
  grp.add(solid(lathe(prof.map(([r, y, s]) => [r, y, s !== false]), 48), mats.rubber))
  // housing: rounded box in the accent finish
  const H = Pp.housing
  const box = new RoundedBoxGeometry(H.w, H.top - H.bottom, H.d, 6, H.r)
  box.translate(0, (H.top + H.bottom) / 2, 0)
  grp.add(solid(box, mats.accent))
  // the steel shell: outside, the rounded lip, and the inside back to the insulator
  const S = Pp.shell
  const hw = S.w / 2
  const hh = S.h / 2
  const wall = S.wall
  const outer = [
    [0.05, S.top],
    [0, S.top - 0.4],
    [0, S.bottom + 0.25],
    [0.03, S.bottom + 0.1],
    [0.1, S.bottom + 0.02],
    [wall * 0.5, S.bottom],
    [wall - 0.02, S.bottom + 0.04],
    [wall, S.bottom + 0.15],
    [wall, S.bottom + S.depth],
  ]
  grp.add(solid(stadiumLoft(hw, hh, outer), mats.steel))
  // the insulator at the back of the opening, and the tongue standing out of it
  const ins = stadiumLoft(hw - wall, hh - wall, [
    [0.01, S.bottom + S.depth],
    [0.01, S.bottom + S.depth - 0.001],
    [hh - wall - 0.02, S.bottom + S.depth - 0.002],
  ])
  grp.add(solid(ins, mats.insulator, false))
  const T = Pp.tongue
  const tBase = S.bottom + S.depth + 0.05
  const tEnd = S.bottom + 0.75
  const tongue = new RoundedBoxGeometry(T.w, tBase - tEnd, T.t, 3, 0.12)
  tongue.translate(0, (tBase + tEnd) / 2, 0)
  // the contacts: the texture runs across the tongue
  grp.add(solid(tongue, mats.contacts, false))
  return grp
}

// ------------------------------------------------------------------------------------ the cable tube
class Tube {
  constructor(maxPoints, radius, radial = 16, sub = 3) {
    this.radius = radius
    this.radial = radial
    this.sub = sub
    const rings = (maxPoints - 1) * sub + 1
    const verts = rings * (radial + 1)
    this.pos = new Float32Array(verts * 3)
    this.nrm = new Float32Array(verts * 3)
    this.uv = new Float32Array(verts * 2)
    this.centre = new Float32Array(rings * 3)
    this.n0 = new Float32Array([0, 1, 0])
    const idx = []
    for (let r = 0; r < rings - 1; r++)
      for (let k = 0; k < radial; k++) {
        const a = r * (radial + 1) + k
        const b = a + radial + 1
        idx.push(a, a + 1, b, b, a + 1, b + 1)
      }
    this.geometry = new THREE.BufferGeometry()
    this.geometry.setIndex(idx)
    this.pa = new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage)
    this.na = new THREE.BufferAttribute(this.nrm, 3).setUsage(THREE.DynamicDrawUsage)
    this.ua = new THREE.BufferAttribute(this.uv, 2).setUsage(THREE.DynamicDrawUsage)
    this.geometry.setAttribute('position', this.pa)
    this.geometry.setAttribute('normal', this.na)
    this.geometry.setAttribute('uv', this.ua)
    this.geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 5000)
    this.cs = new Float32Array(radial + 1)
    this.sn = new Float32Array(radial + 1)
    for (let k = 0; k <= radial; k++) {
      this.cs[k] = Math.cos((k / radial) * Math.PI * 2)
      this.sn[k] = Math.sin((k / radial) * Math.PI * 2)
    }
  }
  /** Rebuild through `count` points (x, y, z in pts): centripetal Catmull-Rom, parallel transport. */
  update(pts, count) {
    const { sub, centre } = this
    let w = 0
    const P = (i, out) => {
      if (i < 0 || i > count - 1) {
        const e = i < 0 ? 0 : count - 1
        const f = i < 0 ? 1 : count - 2
        out[0] = 2 * pts[e * 3] - pts[f * 3]
        out[1] = 2 * pts[e * 3 + 1] - pts[f * 3 + 1]
        out[2] = 2 * pts[e * 3 + 2] - pts[f * 3 + 2]
        return
      }
      out[0] = pts[i * 3]
      out[1] = pts[i * 3 + 1]
      out[2] = pts[i * 3 + 2]
    }
    const p0 = [0, 0, 0]
    const p1 = [0, 0, 0]
    const p2 = [0, 0, 0]
    const p3 = [0, 0, 0]
    const knot = (a, b) => Math.max(1e-4, Math.sqrt(Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2])))
    for (let i = 0; i < count - 1; i++) {
      P(i - 1, p0)
      P(i, p1)
      P(i + 1, p2)
      P(i + 2, p3)
      const t1 = knot(p0, p1)
      const t2 = t1 + knot(p1, p2)
      const t3 = t2 + knot(p2, p3)
      for (let s = 0; s < sub; s++) {
        const t = t1 + ((t2 - t1) * s) / sub
        for (let c = 0; c < 3; c++) {
          const a1 = ((t1 - t) / t1) * p0[c] + (t / t1) * p1[c]
          const a2 = ((t2 - t) / (t2 - t1)) * p1[c] + ((t - t1) / (t2 - t1)) * p2[c]
          const a3 = ((t3 - t) / (t3 - t2)) * p2[c] + ((t - t2) / (t3 - t2)) * p3[c]
          const b1 = ((t2 - t) / t2) * a1 + (t / t2) * a2
          const b2 = ((t3 - t) / (t3 - t1)) * a2 + ((t - t1) / (t3 - t1)) * a3
          centre[w * 3 + c] = ((t2 - t) / (t2 - t1)) * b1 + ((t - t1) / (t2 - t1)) * b2
        }
        w++
      }
    }
    centre[w * 3] = pts[(count - 1) * 3]
    centre[w * 3 + 1] = pts[(count - 1) * 3 + 1]
    centre[w * 3 + 2] = pts[(count - 1) * 3 + 2]
    w++
    const { pos, nrm, uv, radius, radial } = this
    let nx = this.n0[0]
    let ny = this.n0[1]
    let nz = this.n0[2]
    let along = 0
    for (let r = 0; r < w; r++) {
      const a = Math.max(0, r - 1)
      const b = Math.min(w - 1, r + 1)
      let tx = centre[b * 3] - centre[a * 3]
      let ty = centre[b * 3 + 1] - centre[a * 3 + 1]
      let tz = centre[b * 3 + 2] - centre[a * 3 + 2]
      const tl = Math.hypot(tx, ty, tz) || 1
      tx /= tl
      ty /= tl
      tz /= tl
      if (r > 0) along += Math.hypot(centre[r * 3] - centre[(r - 1) * 3], centre[r * 3 + 1] - centre[(r - 1) * 3 + 1], centre[r * 3 + 2] - centre[(r - 1) * 3 + 2])
      // parallel transport: keep the last normal, minus its part along the new tangent
      const d = nx * tx + ny * ty + nz * tz
      nx -= d * tx
      ny -= d * ty
      nz -= d * tz
      let nl = Math.hypot(nx, ny, nz)
      if (nl < 1e-4) {
        // degenerate: start a fresh normal
        if (Math.abs(tx) < 0.9) {
          nx = 0
          ny = -tz
          nz = ty
        } else {
          nx = tz
          ny = 0
          nz = -tx
        }
        nl = Math.hypot(nx, ny, nz)
      }
      nx /= nl
      ny /= nl
      nz /= nl
      if (r === 0) this.n0.set([nx, ny, nz])
      const bx = ty * nz - tz * ny
      const by = tz * nx - tx * nz
      const bz = tx * ny - ty * nx
      const cx = centre[r * 3]
      const cy = centre[r * 3 + 1]
      const cz = centre[r * 3 + 2]
      const v = along / BRAID_TILE
      for (let k = 0; k <= radial; k++) {
        const ox = nx * this.cs[k] + bx * this.sn[k]
        const oy = ny * this.cs[k] + by * this.sn[k]
        const oz = nz * this.cs[k] + bz * this.sn[k]
        const q = (r * (radial + 1) + k) * 3
        pos[q] = cx + ox * radius
        pos[q + 1] = cy + oy * radius
        pos[q + 2] = cz + oz * radius
        nrm[q] = ox
        nrm[q + 1] = oy
        nrm[q + 2] = oz
        const qu = (r * (radial + 1) + k) * 2
        uv[qu] = (k / radial) * 2
        uv[qu + 1] = v
      }
    }
    this.geometry.setDrawRange(0, (w - 1) * radial * 6)
    this.pa.needsUpdate = true
    this.na.needsUpdate = true
    this.ua.needsUpdate = true
  }
}

const VIGNETTE = {
  uniforms: { tDiffuse: { value: null }, strength: { value: 0.16 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float strength; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv); vec2 d = (vUv - 0.5) * vec2(1.0, 0.86);
    float v = smoothstep(0.95, 0.22, length(d)); c.rgb *= mix(1.0 - strength, 1.0, v); gl_FragColor = c; }`,
}

// ------------------------------------------------------------------------------------ build the set
const data = await meshing
const shell = meshGeometry(data.bud)
const parts = {
  budL: makeEarbud('left', shell),
  budR: makeEarbud('right', shell),
  remote: makeRemote(meshGeometry(data.remote)),
  splitter: makeSplitter(),
  bead: makeBead(),
  plug: makePlug(),
}
for (const o of Object.values(parts)) {
  o.matrixAutoUpdate = false
  scene.add(o)
}

const rig = new P.Rig(G.rigSpec(data.collision))
const bodyMatrix = new THREE.Matrix4()
const tmpM = new THREE.Matrix4()
function placeParts() {
  for (const b of rig.bodies) {
    const R = b.R
    // world = c + R (local - com)
    bodyMatrix.set(R[0], R[3], R[6], 0, R[1], R[4], R[7], 0, R[2], R[5], R[8], 0, 0, 0, 0, 1)
    tmpM.makeTranslation(-b.com[0], -b.com[1], -b.com[2])
    bodyMatrix.multiply(tmpM)
    bodyMatrix.elements[12] += b.c[0]
    bodyMatrix.elements[13] += b.c[1]
    bodyMatrix.elements[14] += b.c[2]
    parts[b.name].matrix.copy(bodyMatrix)
    parts[b.name].matrixWorldNeedsUpdate = true
  }
}

// cable tubes: each chain from just inside the part it leaves to just inside the part it enters
const tubes = []
for (const ch of rig.chains) {
  const t = new Tube(ch.ids.length + 6, G.CABLE.radius, 16, 3)
  const mesh = new THREE.Mesh(t.geometry, mats.cable)
  mesh.castShadow = mesh.receiveShadow = true
  mesh.frustumCulled = false
  scene.add(mesh)
  tubes.push({ ch, t, pts: new Float32Array((ch.ids.length + 6) * 3), mesh })
}
const tv = new Float64Array(3)
function updateTubes() {
  for (const tb of tubes) {
    const { ch, pts } = tb
    let n = 0
    const push = (x, y, z) => {
      pts[n * 3] = x
      pts[n * 3 + 1] = y
      pts[n * 3 + 2] = z
      n++
    }
    const pinPoint = (end, inset) => {
      const b = end.body
      rig.pointOf(b, end.point.b, tv)
      const d = end.point.dir
      const R = b.R
      const dx = R[0] * d[0] + R[3] * d[1] + R[6] * d[2]
      const dy = R[1] * d[0] + R[4] * d[1] + R[7] * d[2]
      const dz = R[2] * d[0] + R[5] * d[1] + R[8] * d[2]
      return [tv[0] - dx * inset, tv[1] - dy * inset, tv[2] - dz * inset]
    }
    const a0 = pinPoint(ch.from, 1.6)
    const a1 = pinPoint(ch.from, 0)
    push(...a0)
    push(...a1)
    for (const i of ch.ids) push(rig.x[i * 3], rig.x[i * 3 + 1], rig.x[i * 3 + 2])
    const b1 = pinPoint(ch.to, 0)
    const b0 = pinPoint(ch.to, 1.6)
    push(...b1)
    push(...b0)
    tb.t.update(pts, n)
  }
}

// ------------------------------------------------------------------------------------ layouts
function heroDrop() {
  P.placeSolved(rig, G.HERO)
  rig.release()
  placeParts()
  updateTubes()
  requestRender()
}
/**
 * A random tangle: the parts thrown down from a little higher, each within easy reach of the part
 * its cable leads to (so the cable can always make the trip), the cables in loose random curls. A
 * layout that cannot be met is thrown again.
 */
function tangle(seed = Math.floor(Math.random() * 1e9)) {
  for (let attempt = 0; attempt < 12; attempt++) {
    const plan = tanglePlan(seed + attempt * 7919)
    const report = P.placeSolved(rig, plan)
    if ((report.worstMiss || 0) < 2) break
  }
  rig.release()
  placeParts()
  updateTubes()
  requestRender()
}
function tanglePlan(seed) {
  let s = seed % 2147483647 || 1
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647)
  const R = (a, b) => a + (b - a) * rnd()
  // a point at a random distance and direction from p, kept on the stage
  const near = (p, r0, r1, a0 = -Math.PI, a1 = Math.PI) => {
    const r = R(r0, r1)
    const a = R(a0, a1)
    return [THREE.MathUtils.clamp(p[0] + r * Math.cos(a), -170, 170), R(22, 45), THREE.MathUtils.clamp(p[2] + r * Math.sin(a), -300, 70)]
  }
  const sp = [R(-30, 30), R(22, 40), R(-130, -90)]
  // the bead 36 mm up the leads (towards the front), the remote within reach of it, the left bud
  // within reach of the remote, the right bud of the bead, the plug of the splitter
  const bead = [sp[0] + R(-8, 8), R(22, 40), sp[2] + 36]
  const remote = near(bead, 30, 62, 0.15, Math.PI - 0.15)
  const budL = near(remote, 30, 68)
  const budR = near(bead, 50, 140, 0.2, Math.PI - 0.2)
  const plug = near(sp, 120, 260)
  const face = () => (rnd() < 0.5 ? 'outer' : 'inner')
  const plan = {
    bodies: {
      splitter: { at: sp, heading: R(0.9, 2.2) },
      bead: { at: bead, heading: R(1.1, 2.0) },
      remote: { at: remote, heading: R(-3, 3) },
      budL: { pin: 'cable', at: budL, heading: R(-3, 3), face: face() },
      budR: { pin: 'cable', at: budR, heading: R(-3, 3), face: face() },
      plug: { pin: 'cable', at: plug, heading: R(-3, 3) },
    },
    routes: {},
  }
  const arcs = (n, len, curl) => Array.from({ length: n }, () => [len, R(-curl, curl), R(0, 0.12 * len)])
  plan.routes.leadL1 = { arcs: arcs(5, 24, 1.1) }
  plan.routes.leadL2 = { arcs: arcs(4, 27, 1.1), arcs2: [[10, 0], [10, 0], [10, 0], [10, 0]] }
  plan.routes.leadR = { arcs: arcs(8, 32, 1.2), arcs2: [[10, 0], [10, 0], [10, 0], [10, 0]] }
  plan.routes.main = { arcs: arcs(15, 60, 1.4) }
  return plan
}

// ------------------------------------------------------------------------------------ camera
// the opening view, framed for a landscape screen; frameHome() adapts it to the screen's shape
const HOME_BASE = { pos: new THREE.Vector3(58, 118, 205), target: new THREE.Vector3(-6, 4, 6) }
const HOME = { pos: HOME_BASE.pos.clone(), target: HOME_BASE.target.clone() }
let userMoved = false
const controls = new OrbitControls(camera, renderer.domElement)
controls.enableDamping = true
controls.dampingFactor = 0.08
controls.minDistance = 45
controls.maxDistance = 900
controls.maxPolarAngle = Math.PI / 2 - 0.04
controls.minPolarAngle = 0.08
controls.zoomToCursor = true
controls.screenSpacePanning = true
camera.position.copy(HOME.pos)
controls.target.copy(HOME.target)
controls.update()
controls.addEventListener('change', () => {
  // keep the target over the set, and the camera above the floor
  controls.target.x = THREE.MathUtils.clamp(controls.target.x, -350, 350)
  controls.target.y = THREE.MathUtils.clamp(controls.target.y, 0, 200)
  controls.target.z = THREE.MathUtils.clamp(controls.target.z, -360, 260)
  if (camera.position.y < 3) camera.position.y = 3
  requestRender()
})
controls.addEventListener('start', () => (userMoved = true))
/**
 * On a narrow (portrait) screen, step back and look down more steeply so the buds and the remote
 * still fit across, and the set's depth uses the screen's height.
 */
function frameHome() {
  const narrow = THREE.MathUtils.clamp((1.25 - camera.aspect) / 0.75, 0, 1)
  const off = new THREE.Vector3().subVectors(HOME_BASE.pos, HOME_BASE.target)
  const sph = new THREE.Spherical().setFromVector3(off)
  sph.radius *= Math.max(1, Math.pow(1.55 / camera.aspect, 0.68))
  sph.phi -= THREE.MathUtils.degToRad(16) * narrow
  // (and aim a little further back, so the buds sit lower, nearer the hand)
  HOME.target.copy(HOME_BASE.target).add(new THREE.Vector3(0, 0, -28 * narrow))
  HOME.pos.setFromSpherical(sph).add(HOME.target)
  if (!userMoved && !tween.active) {
    camera.position.copy(HOME.pos)
    controls.target.copy(HOME.target)
    controls.update()
  }
}
const tween = { active: false }
function animateCamera(pos, target, ms = 900) {
  tween.active = true
  tween.t0 = performance.now()
  tween.ms = ms
  tween.fromP = camera.position.clone()
  tween.fromT = controls.target.clone()
  tween.toP = pos.clone()
  tween.toT = target.clone()
  controls.enableDamping = false
  controls.update()
  requestRender()
}
function stepTween(now) {
  if (!tween.active) return
  const t = Math.min(1, (now - tween.t0) / tween.ms)
  const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2
  camera.position.lerpVectors(tween.fromP, tween.toP, e)
  controls.target.lerpVectors(tween.fromT, tween.toT, e)
  if (t >= 1) {
    tween.active = false
    controls.enableDamping = true
  }
  requestRender()
}
function zoomBy(f) {
  userMoved = true
  const off = camera.position.clone().sub(controls.target)
  const d = THREE.MathUtils.clamp(off.length() * f, controls.minDistance, controls.maxDistance)
  animateCamera(controls.target.clone().add(off.setLength(d)), controls.target.clone(), 380)
}

// ------------------------------------------------------------------------------------ picking and grabbing
const raycaster = new THREE.Raycaster()
const ndc = new THREE.Vector2()
function rayAt(cx, cy) {
  const r = renderer.domElement.getBoundingClientRect()
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1)
  raycaster.setFromCamera(ndc, camera)
  return raycaster.ray
}
/** The nearest grabbable thing under a screen point: a body (by its distance field) or the cable. */
function pick(cx, cy) {
  const ray = rayAt(cx, cy)
  let best = null
  const o = ray.origin
  const d = ray.direction
  for (const b of rig.bodies) {
    // where the ray meets the body's bounding sphere
    const ox = o.x - b.c[0]
    const oy = o.y - b.c[1]
    const oz = o.z - b.c[2]
    const bb = ox * d.x + oy * d.y + oz * d.z
    const cc = ox * ox + oy * oy + oz * oz - (b.reach + 0.5) ** 2
    const disc = bb * bb - cc
    if (disc < 0) continue
    let t = Math.max(0, -bb - Math.sqrt(disc))
    const tEnd = -bb + Math.sqrt(disc)
    // march the ray through the part's distance field (outside its grid there is no distance:
    // creep in small steps until the grid starts)
    for (let k = 0; k < 400 && t < tEnd; k++) {
      const dist = rig.bodyDistance(b, o.x + d.x * t, o.y + d.y * t, o.z + d.z * t)
      if (dist < 0.08) {
        if (!best || t < best.t) best = { t, kind: 'body', body: b, point: new THREE.Vector3(o.x + d.x * t, o.y + d.y * t, o.z + d.z * t) }
        break
      }
      t += dist > 1e8 ? 0.6 : Math.max(dist * 0.9, 0.06)
    }
  }
  // the cable: closest approach of the ray to each segment. A ray through the cable is a hit like
  // any other (the nearest wins); one that misses it by a few pixels only counts if it hit nothing
  const rect = renderer.domElement.getBoundingClientRect()
  const pxAt = (dist) => (2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) / rect.height
  const a = new THREE.Vector3()
  const bq = new THREE.Vector3()
  const ps = new THREE.Vector3()
  const pr = new THREE.Vector3()
  const R = G.CABLE.radius
  let miss = null
  for (const ch of rig.chains) {
    for (let k = 0; k < ch.ids.length; k++) {
      const i = ch.ids[k]
      a.set(rig.x[i * 3], rig.x[i * 3 + 1], rig.x[i * 3 + 2])
      const j = ch.ids[k + 1]
      if (j === undefined) bq.copy(a)
      else bq.set(rig.x[j * 3], rig.x[j * 3 + 1], rig.x[j * 3 + 2])
      const d2 = ray.distanceSqToSegment(a, bq, pr, ps)
      const t = pr.distanceTo(o)
      const px = (Math.sqrt(d2) - R) / pxAt(t)
      if (d2 > (R + 7 * pxAt(t)) ** 2) continue
      const near = ps.distanceTo(a) < ps.distanceTo(bq) || j === undefined ? i : j
      if (d2 <= R * R) {
        if (!best || t < best.t) best = { t, kind: 'cable', i: near, point: ps.clone() }
      } else if (!miss || px < miss.px) miss = { t, px, kind: 'cable', i: near, point: ps.clone() }
    }
  }
  return best || miss
}

const plane = new THREE.Plane()
const hitP = new THREE.Vector3()
const camDir = new THREE.Vector3()
let grip = null
function startGrab(h) {
  camera.getWorldDirection(camDir)
  plane.setFromNormalAndCoplanarPoint(camDir.clone().negate(), h.point)
  if (h.kind === 'body') {
    // the grabbed point, in the body's own frame
    const b = h.body
    const R = b.R
    const dx = h.point.x - b.c[0]
    const dy = h.point.y - b.c[1]
    const dz = h.point.z - b.c[2]
    const s = [R[0] * dx + R[1] * dy + R[2] * dz + b.com[0], R[3] * dx + R[4] * dy + R[5] * dz + b.com[1], R[6] * dx + R[7] * dy + R[8] * dz + b.com[2]]
    rig.grab({ body: b, s }, [h.point.x, h.point.y, h.point.z])
  } else rig.grab({ i: h.i }, [h.point.x, h.point.y, h.point.z])
  grip = { h }
  controls.enabled = false
  renderer.domElement.style.cursor = 'grabbing'
  hideHint()
  requestRender()
}

      id: e.pointerId,
      x: e.clientX,
      y: e.clientY,
      timer: setTimeout(() => {
        if (!press) return
        try {

  canvas.style.cursor = h ? 'grab' : 'auto'

}

const coarse = matchMedia('(pointer: coarse)').matches

let hintShown = true

  if (!hintShown) return

}
for (const b of document.querySelectorAll('[data-action]'))
  b.addEventListener('click', () => {

    else if (a === 'zoom-out') zoomBy(1.35)
    else if (a === 'reset') {
      animateCamera(HOME.pos, HOME.target)
      userMoved = false
    }
    else if (a === 'theme') setTheme(theme === 'dark' ? 'light' : 'dark')
    else if (a === 'drop') heroDrop()
    else if (a === 'tangle') tangle()

for (const b of document.querySelectorAll('.swatch')) b.addEventListener('click', () => setColorway(b.dataset.colorway))

// ------------------------------------------------------------------------------------ the loop
let needsRender = true
function requestRender() {
  needsRender = true
}
function resize() {
  const w = stage.clientWidth
  const h = stage.clientHeight
  renderer.setPixelRatio(dpr)
  renderer.setSize(w, h, false)
  composer.setPixelRatio(dpr)
  composer.setSize(w, h)
  camera.aspect = w / h
  camera.updateProjectionMatrix()

}
window.addEventListener('resize', resize)
renderer.getDrawingBufferSize(size)
resize()
setTheme(theme)
setColorway(params.get('colorway') && COLORWAYS[params.get('colorway')] ? params.get('colorway') : 'graphite', true)

// frame-time watch: while frames are drawn back to back, time them (the GPU's pace shows in the
// gap between frames, not in the time the draw calls take); if they are slow, draw fewer pixels
const perf = { t: 0, n: 0, lastDraw: -1 }
let last = performance.now()
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000)
  last = now
  stepTween(now)

  doHover()
  if (colorTween.t < 1) {
    colorTween.t = Math.min(1, colorTween.t + dt / 0.45)
    applyColors(colorTween.t)
    needsRender = true
  }
  if (rig.update(dt)) {
    placeParts()
    updateTubes()
    needsRender = true
  }
  if (needsRender) {
    if (perf.lastDraw >= 0 && now - perf.lastDraw < 100) {
      perf.t += now - perf.lastDraw
      perf.n++
      if (perf.n === 40) {
        if (perf.t / perf.n > 24 && dpr > 1) {
          dpr = Math.max(1, dpr - 0.25)

        perf.t = perf.n = 0

heroDrop()
document.body.classList.add('ready')
requestAnimationFrame(frame)

/** Debug: run the physics until it rests (or `seconds` of it), then show it. */
function settleNow(seconds = 20) {
  for (let k = 0; k < seconds * 120 && !rig.asleep; k++) rig.step()
  placeParts()
  updateTubes()
  requestRender()
  return rig.asleep
