<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Krish P.</title>
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg class="pod" viewBox="-10 0 683 1189" role="img" aria-label="Krish's pod" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="outer-clip">
        <rect x="0" y="0" width="663" height="1189" rx="106" />
      </clipPath>
      <clipPath id="face-clip">
        <rect x="24" y="24" width="615" height="1141" rx="82" />
      </clipPath>

      <!-- white plastic: soft light from above, edges falling away -->
      <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" />
        <stop offset="1" stop-color="#ebebe9" />
      </linearGradient>
      <linearGradient id="shell-shine" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
        <stop offset="0.35" stop-color="#ffffff" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fcfcfa" />
        <stop offset="1" stop-color="#f0f0ee" />
      </linearGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.07" />
        <stop offset="0.42" stop-color="#ffffff" stop-opacity="0" />
      </linearGradient>
      <radialGradient id="lens" cx="0.45" cy="0.4" r="0.6">
        <stop offset="0" stop-color="#121722" />
        <stop offset="1" stop-color="#020203" />
      </radialGradient>
      <linearGradient id="hole" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#262628" />
        <stop offset="1" stop-color="#5d5d60" />
      </linearGradient>
      <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" />
        <stop offset="1" stop-color="#eeeeec" />
      </linearGradient>
      <linearGradient id="key-edge" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
        <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
        <stop offset="1" stop-color="#000000" stop-opacity="0.08" />
      </linearGradient>
      <radialGradient id="dome" cx="0.5" cy="0.62" r="0.62">
        <stop offset="0" stop-color="#ffffff" />
        <stop offset="0.62" stop-color="#f6f6f4" />
        <stop offset="1" stop-color="#e2e2e0" />
      </radialGradient>
      <linearGradient id="dome-edge" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#000000" stop-opacity="0.13" />
        <stop offset="0.55" stop-color="#000000" stop-opacity="0.04" />
        <stop offset="1" stop-color="#ffffff" stop-opacity="1" />
      </linearGradient>
      <radialGradient id="red" cx="0.4" cy="0.35" r="0.72">
        <stop offset="0" stop-color="#ff5a45" />
        <stop offset="0.7" stop-color="#ee2a1d" />
        <stop offset="1" stop-color="#d21d12" />
      </radialGradient>
      <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#e6e6e4" />
        <stop offset="0.45" stop-color="#ffffff" />
        <stop offset="1" stop-color="#d4d4d2" />
      </linearGradient>
      <filter id="blur-1" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="1.4" />
      </filter>
      <filter id="blur-3" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="3" />
      </filter>
      <filter id="blur-5" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="5" />
      </filter>
      <g id="grille-row" class="hole">
        <circle cx="59.34" cy="0" r="4" />
        <circle cx="79.5" cy="0" r="4" />
        <circle cx="99.66" cy="0" r="4" />
        <circle cx="119.82" cy="0" r="4" />
        <circle cx="139.98" cy="0" r="4" />
        <circle cx="160.14" cy="0" r="4" />
        <circle cx="180.3" cy="0" r="4" />
        <circle cx="200.46" cy="0" r="4" />
        <circle cx="220.62" cy="0" r="4" />
        <circle cx="240.78" cy="0" r="4" />
        <circle cx="260.94" cy="0" r="4" />
        <circle cx="281.1" cy="0" r="4" />
        <circle cx="301.26" cy="0" r="4" />
        <circle cx="321.42" cy="0" r="4" />
        <circle cx="341.58" cy="0" r="4" />
        <circle cx="361.74" cy="0" r="4" />
        <circle cx="381.9" cy="0" r="4" />
        <circle cx="402.06" cy="0" r="4" />
        <circle cx="422.22" cy="0" r="4" />
        <circle cx="442.38" cy="0" r="4" />
        <circle cx="462.54" cy="0" r="4" />
        <circle cx="482.7" cy="0" r="4" />
        <circle cx="502.86" cy="0" r="4" />
        <circle cx="523.02" cy="0" r="4" />
        <circle cx="543.18" cy="0" r="4" />
        <circle cx="563.34" cy="0" r="4" />
        <circle cx="583.5" cy="0" r="4" />
        <circle cx="603.66" cy="0" r="4" />
      </g>
    </defs>

    <!-- side button -->
    <rect class="side-button" x="659" y="275.5" width="11.5" height="150" rx="3.5" />

    <!-- border: one piece of white plastic around the face -->
    <rect x="0" y="0" width="663" height="1189" rx="106" fill="url(#shell)"/>
    <g clip-path="url(#outer-clip)">
      <!-- its outer edge rolls away from the light -->
      <rect x="0" y="0" width="663" height="1189" rx="106" fill="none" stroke="#c9c9c7" stroke-width="9" filter="url(#blur-3)"/>
      <!-- and a soft shine runs along its top -->
      <rect x="6" y="6" width="651" height="1177" rx="100" fill="none" stroke="url(#shell-shine)" stroke-width="3" filter="url(#blur-1)"/>
    </g>

    <!-- face -->
    <g clip-path="url(#face-clip)">
      <rect x="24" y="24" width="615" height="1141" rx="0" fill="url(#face)"/>

      <!-- keypad: gaps, three keys, domes -->
      <rect x="24" y="910" width="615" height="177" fill="#9c9c9a" />
      <rect class="key" x="14" y="913" width="212.33" height="170" rx="3" />
      <rect class="key" x="230.33" y="913" width="202.33" height="170" rx="3" />
      <rect class="key" x="436.67" y="913" width="212.33" height="170" rx="3" />
      <circle class="dome" cx="125.17" cy="998" r="60" />
      <ellipse class="gloss" cx="105.17" cy="971" rx="25" ry="12" transform="rotate(-24 105.17 971)" />
      <circle class="dome" cx="331.5" cy="998" r="60" />
      <ellipse class="gloss" cx="311.5" cy="971" rx="25" ry="12" transform="rotate(-24 311.5 971)" />
      <circle class="dome" cx="537.83" cy="998" r="60" />
      <ellipse class="gloss" cx="517.83" cy="971" rx="25" ry="12" transform="rotate(-24 517.83 971)" />

      <!-- the border stands a touch proud of the face: a soft shade along the seam -->
      <rect x="24" y="24" width="615" height="1141" rx="82" fill="none" stroke="#000" stroke-opacity="0.1" stroke-width="8" filter="url(#blur-3)"/>
    </g>
    <!-- the seam between border and face -->
    <rect x="24" y="24" width="615" height="1141" rx="82" fill="none" stroke="#c4c4c2" stroke-width="1.6"/>
    <rect x="25.6" y="25.6" width="611.8" height="1137.8" rx="80.4" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1"/>

    <!-- screen, with the punch-hole camera at the centre of its top-left corner -->
    <rect x="35" y="35" width="593" height="631" rx="71" fill="#c8c8c6"/>
    <rect x="36" y="36" width="591" height="629" rx="70" fill="#0a0a0b"/>
    <rect x="36" y="36" width="591" height="629" rx="70" fill="url(#glass)"/>
    <circle cx="106" cy="106" r="13" fill="#1b1c1f" />
    <circle cx="106" cy="106" r="12.25" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />
    <circle cx="106" cy="106" r="8.5" fill="url(#lens)" />
    <circle cx="106" cy="106" r="5.2" fill="none" stroke="#5c7bc4" stroke-opacity="0.22" stroke-width="1" />
    <circle cx="103.4" cy="103.2" r="1.9" fill="#ffffff" fill-opacity="0.35" />

    <!-- labels under the screen -->
    <rect class="badge" x="55" y="689" width="89.4" height="25" rx="5" />
    <text class="badge-text" x="100.1" y="706.41" text-anchor="middle">HD AUDIO</text>
    <text class="label" x="332.65" y="706.77" text-anchor="middle">DISPLAY</text>
    <rect class="badge" x="562" y="689" width="46" height="25" rx="5" />
    <path class="badge-icon" d="M578 705V702A7 7 0 0 1 592 702V705" />
    <rect class="badge-fill" x="576.4" y="702.1" width="4.2" height="6.4" rx="1.6" />
    <rect class="badge-fill" x="589.4" y="702.1" width="4.2" height="6.4" rx="1.6" />

    <!-- speaker grille -->
    <use href="#grille-row" y="753" />
    <use href="#grille-row" y="773" />
    <use href="#grille-row" y="793" />
    <use href="#grille-row" y="813" />
    <use href="#grille-row" y="833" />
    <text class="label" x="332.65" y="881.27" text-anchor="middle">SPEAKERS</text>

    <!-- key symbols -->
    <polygon class="key-icon" points="107.17,998 134.17,983 134.17,1013" />
    <polygon class="key-icon" points="349.5,998 322.5,983 322.5,1013" />
    <circle cx="537.83" cy="998" r="21" fill="url(#red)" />
    <ellipse cx="530.83" cy="989" rx="8" ry="4.5" fill="#ffffff" fill-opacity="0.45" transform="rotate(-30 530.83 989)" filter="url(#blur-1)" />

    <!-- bottom strip: AUX on the left, mic on the right -->
    <text class="label" x="80.4" y="1131.27">AUX</text>
    <circle cx="538.57" cy="1126" r="3.2" fill="#555557" />
    <text class="label" x="550.57" y="1131.27">MIC</text>
  </svg>
</body>
</html>
